在說話。眼見耳聞也需要核對來源。", "ep": "用人工智慧製造逼真假影像或聲音的技術。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "行為因素", "en": "Something You Do", "cat": "存取控制與身分認證", "ex": "像家人從走路步伐認出你。判斷來自動作習慣，而不是攜帶的物件。", "ep": "用個人的行為模式協助辨認身分。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "託管身分", "en": "Managed Identity", "cat": "存取控制與身分認證", "ex": "像大樓管理處代管維修人員的臨時通行資格。承辦人不用自己保存每把鑰匙。", "ep": "由平台管理程式身分與驗證資料的機制。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "隱私資訊管理系統", "en": "PIMS, Privacy Information Management System", "cat": "相關法規概論與遵循", "ex": "像會員資料有完整的收取、使用與銷毀規則。不同階段都能找到負責的人。", "ep": "管理個人資料隱私風險、責任與措施的制度。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "Administrator 內建帳號", "en": "Windows Built-in Administrator Account", "cat": "存取控制與身分認證", "ex": "像交屋時附上的總鑰匙，能開啟許多重要房間。鑰匙是一項工具，不是保管它的管理員本人。", "ep": "Windows 預設建立的高權限管理帳號。", "o": "兩者", "s": ["109-2", "樣題2", "樣題1"], "w": 3, "r": 0, "h": []}, {"zh": "Kerberos 票證驗證", "en": "Kerberos Authentication", "cat": "存取控制與身分認證", "ex": "像先向售票中心證明資格，再領到可換各場票券的證明。不用向每個場館重交秘密。", "ep": "透過可信中心與票證驗證網路服務身分的協定。", "o": "考古題", "s": ["111-2", "樣題2", "樣題1"], "w": 3, "r": 0, "h": []}, {"zh": "Windows 作業系統", "en": "Microsoft Windows", "cat": "存取控制與身分認證", "ex": "像一位負責安排家電與工作順序的管家。使用者透過它操作各種工具。", "ep": "微軟提供、用來管理設備與執行應用的作業系統。", "o": "兩者", "s": ["109-1", "107-1", "樣題2"], "w": 3, "r": 0, "h": []}, {"zh": "root 超級使用者帳號", "en": "root Superuser Account", "cat": "存取控制與身分認證", "ex": "像一張能進入所有重要區域的總通行證。誰使用這張證件，仍須另外確認與記錄。", "ep": "類 Unix 系統中具有最高管理權限的帳號。", "o": "兩者", "s": ["109-2", "樣題2", "樣題1"], "w": 3, "r": 0, "h": []}, {"zh": "個人資料利用", "en": "Use of Personal Data", "cat": "隱私權保護與智慧財產權", "ex": "像依報名名冊通知參加者活動時間。這次是拿名冊內容來辦事。", "ep": "將已蒐集個資用於檔案處理以外的用途。", "o": "兩者", "s": ["111-2", "110-2", "109-2"], "w": 3, "r": 0, "h": []}, {"zh": "個人資料蒐集", "en": "Collection of Personal Data", "cat": "隱私權保護與智慧財產權", "ex": "像請會員填寫姓名和聯絡電話。拿到這些資料的動作就是收取。", "ep": "以任何方式取得個人資料。", "o": "兩者", "s": ["112-1", "111-2", "109-2"], "w": 3, "r": 0, "h": []}  0, "h": []}, {"zh": "無線射頻識別", "en": "RFID, Radio-frequency Identification", "cat": "存取控制與身分認證", "ex": "像隔著一小段距離感應入場證。無須把卡上的字逐一讀出。", "ep": "用無線電讀取標籤以識別物件的技術。", "o": "考古題", "s": ["111-1", "樣題2", "樣題1"], "w": 3, "r": 0, "h": []}, {"zh": "磁帶", "en": "Magnetic Tape", "cat": "備援與營運持續", "ex": "像一卷按順序排列的長清單。適合大量保存，但找指定位置可能要捲到那一段。", "ep": "以磁性帶材循序儲存資料的媒體。", "o": "考古題", "s": ["112-2", "樣題2", "樣題1"], "w": 3, "r": 0, "h": []}, {"zh": "緊急備份", "en": "Emergency Backup", "cat": "備援與營運持續", "ex": "像颱風將到時先把重要證件多留一份。這是情境性作法，非完整與增量那類變更範圍分類。", "ep": "在緊急情況下額外保存重要資料的備份。", "o": "兩者", "s": ["110-1", "109-1", "108-1"], "w": 3, "r": 0, "h": []}, {"zh": "臉部辨識", "en": "Facial Recognition", "cat": "存取控制與身分認證", "ex": "像門口管理員核對證件照片和來訪者。外貌相似或照片偽造可能造成混淆。", "ep": "利用臉部特徵比對身分。", "o": "考古題", "s": ["112-2", "107-1", "樣題2"], "w": 3, "r": 0, "h": []}, {"zh": "資產評估", "en": "Asset Assessment", "cat": "資產分類分級與盤點", "ex": "像盤點物品後再判斷哪些失去會影響最大。昂貴不一定等於最重要。", "ep": "評估資產的重要性、敏感性及相關價值。", "o": "考古題", "s": ["112-2", "樣題2", "樣題1"], "w": 3, "r": 0, "h": []}, {"zh": "資訊倫理", "en": "Information Ethics", "cat": "隱私權保護與智慧財產權", "ex": "像拿到朋友的信也不偷看。即使沒人監督，也尊重別人的權益。", "ep": "使用資訊時應遵守的道德與責任原則。", "o": "兩者", "s": ["110-2", "109-2", "109-1"], "w": 3, "r": 0, "h": []}, {"zh": "資訊安全經理", "en": "Information Security Manager", "cat": "資訊安全管理概念", "ex": "像社區防災小組的執行隊長。把總召的安排落實成每天的工作。", "ep": "負責推動及管理日常資訊安全工作的人。", "o": "考古題", "s": ["108-1", "107-1", "樣題2"], "w": 3, "r": 0, "h": []}, {"zh": "資訊風險經理", "en": "Information Risk Manager", "cat": "資訊安全管理概念", "ex": "像出遊前專門確認天氣、路況與備案的人。把可能出問題的地方整理給大家決定。", "ep": "統籌資訊風險辨識、評估與追蹤的人。", "o": "考古題", "s": ["108-1", "107-1", "樣題2"], "w": 3, "r": 0, "h": []}, {"zh": "身分與存取管理", "en": "IAM, Identity and Access Management", "cat": "存取控制與身分認證", "ex": "像社區集中管理住戶名冊和門卡。入住、換房或搬走時都要調整。", "ep": "管理數位身分、登入驗證與存取權限。", "o": "考古題", "s": ["110-2", "107-1", "樣題2"], "w": 3, "r": 0, "h": []}, {"zh": "軟體授權", "en": "Software License", "cat": "隱私權保護與智慧財產權", "ex": "像租車合約限定使用時間及駕駛人。拿到車鑰匙不表示能任意轉租。", "ep": "規定可如何安裝、使用或分享軟體的許可條件。", "  "存取控制與身分認證", "ex": "像餐廳服務窗口有固定點餐方式。客人不必進廚房也能請廚師完成工作。", "ep": "讓不同程式依約定方式交換資料或請求功能的介面。", "o": "考古題", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "授權檢查", "en": "Authorization Checks", "cat": "存取控制與身分認證", "ex": "像每次領倉庫物品都核對領取資格。之前來過不代表這次任何物品都能拿。", "ep": "每次敏感操作時確認當事人是否有權執行。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "數位營運韌性法案", "en": "DORA, Digital Operational Resilience Act", "cat": "相關法規概論與遵循", "ex": "像要求金融服務的辦事窗口遇到事故仍能維持重要工作。保護也涵蓋合作廠商提供的服務。", "ep": "歐盟針對金融業資訊科技風險與營運韌性的法規。", "o": "考古題", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "橫向移動", "en": "Lateral Movement", "cat": "事件與事故管理", "ex": "像小偷進一間房後再找通往其他房的門。最初入屋只是第一步。", "ep": "攻擊者從已入侵位置轉向其他系統。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "監控與資料擷取系統", "en": "SCADA, Supervisory Control and Data Acquisition", "cat": "存取控制與身分認證", "ex": "像管理室同時查看各地水閥狀態並調整。可集中掌握遠處設施運作。", "ep": "集中監看並控制分散工業設備的系統。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "網路偵測與回應", "en": "NDR, Network Detection and Response", "cat": "事件與事故管理", "ex": "像巡邏員觀察街道行人與車輛異常。發現可疑行動後安排處理。", "ep": "分析網路活動以發現威脅並協助回應。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "網路安全暨基礎設施安全局", "en": "CISA, Cybersecurity and Infrastructure Security Agency", "cat": "事件與事故管理", "ex": "像負責重要公共設施防護的專責中心。提供警訊與協助各單位提高防護。", "ep": "美國負責網路與關鍵基礎設施安全的機構。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "資安事故管理計畫", "en": "Information Security Incident Management Plan", "cat": "事件與事故管理", "ex": "像店家事先寫好發生事故時由誰受理及處置。臨時出事時就有具體安排可依循。", "ep": "規劃資安事故的準備、分工及處理作業。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "資料生命週期", "en": "Data Lifecycle", "cat": "資產分類分級與盤點", "ex": "像報名表從填寫、聯絡到活動後銷毀。每一步都需要適當保管。", "ep": "資料從取得、使用、保存到刪除的全程。", "o": "兩者", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "通用第二因素", "en": "U2F, Universal 2nd Factor", "cat": "存取控制與身分認證", "ex": "像除了口令還要插入專用實體鑰匙。只有記住口令仍無法進門。", "ep": "FIDO 以安全金鑰作為第二因素的驗證標準。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "通用驗證架構", "en" : ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "Wireshark 封包分析工具", "en": "Wireshark", "cat": "事件與事故管理", "ex": "像觀察運輸路線上每個包裹的外觀與可讀標示。未妥善封裝的內容可能被看見。", "ep": "擷取並解析網路封包內容的工具。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "X.500 目錄標準", "en": "X.500, Directory Services Standards", "cat": "加解密與金鑰生命週期", "ex": "像共同約定名冊中的姓名、部門及地址格式。不同單位能一致查找。", "ep": "規範目錄資訊與名稱組織方式的標準系列。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "交換器", "en": "Network Switch", "cat": "存取控制與身分認證", "ex": "像大樓收發室把包裹送到正確房間。主要負責同一環境中的轉送。", "ep": "在區域網路中依設備位址轉送資料的設備。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "交握協定", "en": "Handshake Protocol", "cat": "加解密與金鑰生命週期", "ex": "像交易前先確認對方身分及用哪一種鎖箱。談妥後才開始運送物品。", "ep": "在正式通訊前協商安全參數與建立金鑰的程序。", "o": "考古題", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "人員資產", "en": "Personnel Asset", "cat": "資產分類分級與盤點", "ex": "像熟悉獨家做法的老廚師。管理時也須考量知識交接與可替代性。", "ep": "組織所依賴的人員知識、技能及角色資源。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "位元對位元複製", "en": "Bit-for-bit Copy; Forensic Image", "cat": "事件與事故管理", "ex": "像連空白頁及邊角註記都完整複印一本簿子。不是只挑看起來重要的頁面。", "ep": "逐位元複製媒體內容以保存完整數位證據。", "o": "考古題", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "位元錯誤率", "en": "BER, Bit Error Rate", "cat": "存取控制與身分認證", "ex": "像傳一百個字時有幾個字聽錯。以最小傳遞單位計算差錯比例。", "ep": "收到的位元中出錯位元所占比例。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "使用者帳戶控制", "en": "UAC, User Account Control", "cat": "存取控制與身分認證", "ex": "像借用總鑰匙前再請主管確認。平常工作不必一直持有最高權限。", "ep": "Windows 執行高權限操作前的提升權限確認機制。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "個人參與原則", "en": "Individual Participation Principle", "cat": "隱私權保護與智慧財產權", "ex": "像會員能查看登記卡並請店家改正錯誤。本人有參與資料管理的機會。", "ep": "讓個人能了解並對自身資料提出要求。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "入侵偵測系統", "en": "IDS, Intrusion Detection System", "cat": "事件與事故管理", "ex": "像保全看到可疑人便通報。主要功能是發現與告警。", "ep": "監看活動並對可能入侵提出警示的系統。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "入侵防禦系統", "en": "IPS, Intrusion Prevention System", "cat": "事件與事故管理", "ex": "像保全發現可疑闖入就攔下。除了報警，也能立即阻止通行。", "ep": "偵測並可主動阻擋可疑攻擊的系統。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "公開原則", "en": "Openness Principle", "cat": "隱私權保護與智慧財產權", "ex": "像店家清楚張貼會員資料使用說明。顧客能知道資料會被怎樣處理。", "ep": "清楚公開個資處理的政策與做法。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "創用 CC", "en": "CC, Creative Commons", "cat": "隱私權保護與智慧財產權", "ex": "像作者在照片旁寫好可分享但須署名的規則。使用者依標示條件使用。", "ep": "讓作者用標準授權條件允許他人利用作品。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "區塊加密", "en": "Block Cipher", "cat": "加解密與金鑰生命週期", "ex": "像把貨物分成同尺寸箱子再上鎖。最後不足一箱也需依規則處理。", "ep": "把資料分成固定大小區塊後逐塊加密。", "o": "考古題", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "危機溝通計畫", "en": "Crisis Communications Plan", "cat": "事件與事故管理", "ex": "像停水時約定由管理員統一通知住戶。內容一致可減少謠言與混亂。", "ep": "規劃危機時向相關人說明狀況的方式與分工。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "國際標準化組織", "en": "ISO, International Organization for Standardization", "cat": "相關法規概論與遵循", "ex": "像大家共同訂定插頭尺寸的聯盟。不同廠商照規格製作就更容易配合。", "ep": "制定各領域國際標準的組織。", "o": "兩者", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "國際認證論壇", "en": "IAF, International Accreditation Forum", "cat": "相關法規概論與遵循", "ex": "像各地考試機構約好互認可靠證書。持證人跨地區時較不用全部重考。", "ep": "促進認證制度互相承認的國際組織。", "o": "考古題", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "國際資料加密演算法", "en": "IDEA, International Data Encryption Algorithm", "cat": "加解密與金鑰生命週期", "ex": "像另一款以共同鑰匙開關的鎖箱。名稱不同，仍需雙方妥善共享秘密。", "ep": "一種對稱式區塊加密演算法。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "妨害電腦使用罪", "en": "Offences Against Computer Use", "cat": "隱私權保護與智慧財產權", "ex": "像法律禁止偷進別人屋裡並破壞物品。數位環境的非法入侵及破壞也有責任。", "ep": "刑法中處罰非法入侵、破壞電腦資料等行為的罪章。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "安全多用途網際網路郵件延伸", "en": "S/MIME, Secure Multipurpose Internet Mail Extensions", "cat": "加解密與金鑰生命週期", "ex": "像把信及附件一同封進安全信封。也能加上可查驗寄件人的封印。", "ep": "為電子郵件與附件提供加密和簽章的標準。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "安全宣告標記語言", "en": "SAML, Security Assertion Markup Language", "cat": "存取控制與身分認證", "ex": "像兩間會館使用約定格式互認資格證明。對方能讀懂證明的身分及效力。", "ep": "讓服務交換身分驗證與授權宣告的標準。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "客戶關係管理", "en": "CRM, Customer Relationship Management", "cat": "資產分類分級與盤點", "ex": "像店家為熟客保存偏好及服務紀錄。下次服務時能接續了解需求。", "ep": "集中管理客戶互動、需求與服務紀錄的系統。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "容錯", "en": "Fault Tolerance", "cat": "備援與營運持續", "ex": "像推車一個輪子出問題仍能穩定承重。設計讓局部失效不致整體停擺。", "ep": "部分元件故障時仍能維持指定功能的能力。", "o": "兩者", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "密碼金鑰庫", "en": "Cryptographic Vault", "cat": "加解密與金鑰生命週期", "ex": "像重要鑰匙統一放在有控管的保險庫。借用和歸還都受到記錄與限制。", "ep": "集中保護及管理金鑰等秘密的儲存設施。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "寫入權限", "en": "Write Permission", "cat": "存取控制與身分認證", "ex": "像獲得在共同記事本寫字的許可。是否能刪整本仍須看其他規則。", "ep": "允許新增或修改指定資料。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "封包錯誤率", "en": "PER, Packet Error Rate", "cat": "存取控制與身分認證", "ex": "像一百個包裹中有幾個交付出錯。這次算的是整個包裹，而不是包裹內單件物品。", "ep": "傳送封包中含錯誤或失敗封包的比例。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "年發生率", "en": "ARO, Annualized Rate of Occurrence", "cat": "風險評鑑與風險處理", "ex": "像平均五年漏水一次。換算後每年預期發生零點二次。", "ep": "某事件每年預期發生的次數。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "年預期損失", "en": "ALE, Annualized Loss Expectancy", "cat": "風險評鑑與風險處理", "ex": "像每次維修兩萬元且平均五年一次。平均每年的預期損失就是四千元。", "ep": "單次預期損失乘年發生率所得的年度損失估計。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "後量子密碼學", "en": "PQC, Post-quantum Cryptography", "cat": "加解密與金鑰生命週期", "ex": "像預先研製能抵擋未來新型開鎖工具的鎖。不是等新工具出現才開始換鎖。", "ep": "設計能抵抗已知量子攻擊的密碼技術。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "復原性控制", "en": "Recovery Control", "cat": "事件與事故管理", "ex": "像水災後依備用清單重建家中必需品。重點是讓生活重新運作。", "ep": "在事故後恢復功能與資料的保護措施。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "循環冗餘檢查", "en": "CRC, Cyclic Redundancy Check", "cat": "加解密與金鑰生命週期", "ex": "像點貨時用簡單核對數字找漏件。能抓一般差錯，但不能可靠防範刻意造假。", "ep": "偵測資料意外傳輸或儲存錯誤的檢查方法。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "擴充終端存取控制協定", "en": "XTACACS, Extended TACACS", "cat": "存取控制與身分認證", "ex": "像舊版門禁規則增加了幾項功能。理解它有助分辨後續新規則。", "ep": "由 TACACS 擴充而來的歷史性驗證協定。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "攻擊途徑", "en": "AV, Attack Vector", "cat": "風險評鑑與風險處理", "ex": "像竊賊是能從街上動手，還是必須先進屋。接近方式不同會影響下手條件。", "ep": "攻擊者接觸並利用漏洞所需的途徑。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "文件資產", "en": "Document Asset", "cat": "資產分類分級與盤點", "ex": "像房契與保固書。紙張本身便宜，內容卻可能十分重要。", "ep": "有資訊價值且須保護的文件或紀錄。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "曝露因子", "en": "EF, Exposure Factor", "cat": "風險評鑑與風險處理", "ex": "像一場漏水預計毀掉四分之一家具。這個四分之一就是損失比例。", "ep": "單次事件預期造成的資產損失比例。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "服務票證", "en": "ST, Service Ticket", "cat": "存取控制與身分認證", "ex": "像已換好的某場電影票。能進指定場次，不能任意進其他影廳。", "ep": "讓使用者向特定 Kerberos 服務證明資格的票證。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "柵欄密碼", "en": "Rail Fence Cipher", "cat": "加解密與金鑰生命週期", "ex": "像把字條沿折線分放幾排後逐排收起。重建擺放順序就能讀回內容。", "ep": "將字元依折線排列後分列讀出的移位密碼。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "檢查表測試", "en": "Checklist Test", "cat": "備援與營運持續", "ex": "像出遊前逐項勾選護照、藥品和車票。確認都準備好才出發。", "ep": "以清單逐項核對計畫與準備是否齊全。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "正確拒絕率", "en": "TRR, True Rejection Rate", "cat": "存取控制與身分認證", "ex": "像管理員把陌生冒名者正確擋在門外。這次拒絕是對的，不是誤擋住戶。", "ep": "把不應通過者正確擋下的比例。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "漢明碼", "en": "Hamming Code", "cat": "加解密與金鑰生命週期", "ex": "像傳話時附上額外核對提示。漏聽一小部分仍可能推回原句。", "ep": "加入檢查資訊以偵測並修正部分位元錯誤的編碼。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "瀏覽器小型文字紀錄", "en": "Cookie; HTTP Cookie", "cat": "隱私權保護與智慧財產權", "ex": "像店家發給你一張取餐號碼牌。下次出示時就知道你先前的安排。", "ep": "網站存放於瀏覽器的小資料，用來記住狀態等資訊。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "無人看守設備", "en": "Unattended Equipment", "cat": "存取控制與身分認證", "ex": "像櫃台人員離開卻把收銀抽屜開著。離開前要採取鎖定等保護。", "ep": "使用者離開、暫無人管理的設備。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "環境資產", "en": "Environmental Asset", "cat": "資產分類分級與盤點", "ex": "像保存食物需要合適冷藏環境。周邊條件出問題，物品也會受損。", "ep": "支援資訊設備運作的場地與環境設施。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "相互認證", "en": "Mutual Authentication", "cat": "存取控制與身分認證", "ex": "像你核對送貨員證件，送貨員也核對收件人。不是只有一方被查驗。", "ep": "通訊雙方都驗證對方身分的機制。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "票證授予票證", "en": "TGT, Ticket-granting Ticket", "cat": "存取控制與身分認證", "ex": "像可以換取各場次門票的總兌換券。還要換成對應場次的票才能入場。", "ep": "Kerberos 中用來申請各服務票證的票證。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "稽核證據", "en": "Audit Evidence", "cat": "相關法規概論與遵循", "ex": "像維修單與實際裝好的滅火器。比一句已經買好更能證明工作完成。", "ep": "可查證且與查核要求有關的紀錄或事實。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "第一類錯誤", "en": "Type I Error", "cat": "事件與事故管理", "ex": "像門口把真正住戶誤認為外人。是一種把正常情況判成有問題的錯誤。", "ep": "在驗證題目中常指把真正本人錯誤拒絕。", "o": "考古題", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "第二類錯誤", "en": "Type II Error", "cat": "事件與事故管理", "ex": "像門口把冒名者當成住戶放行。是一種漏掉真問題的錯誤。", "ep": "在驗證題目中常指把非本人錯誤接受。", "o": "考古題", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "紀錄協定", "en": "Record Protocol", "cat": "加解密與金鑰生命週期", "ex": "像把談妥運送的物品逐箱封裝。每箱依相同保護規則處理。", "ep": "將通訊資料分段並依協議保護傳送的機制。", "o": "考古題", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "經濟合作暨發展組織", "en": "OECD, Organisation for Economic Co-operation and Development", "cat": "隱私權保護與智慧財產權", "ex": "像多個社區一起研究更好的公共管理方法。整理出原則供成員參考。", "ep": "提出政策研究及個資保護原則等指引的國際組織。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "網域控制站", "en": "Domain Controller", "cat": "存取控制與身分認證", "ex": "像社區驗明住戶身分的中央管理室。各入口依這裡的名冊查驗。", "ep": "集中提供網域帳號驗證與管理的伺服器。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "網路存取控制", "en": "NAC, Network Access Control", "cat": "存取控制與身分認證", "ex": "像社區不只查訪客，也檢查帶入物品是否符合規定。合格後才讓它進入。", "ep": "依身分及設備條件管制網路接入。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "網路遠端終端協定", "en": "Telnet", "cat": "存取控制與身分認證", "ex": "像直接用大家聽得到的擴音器對遠方管家下指令。內容可能被旁人聽見。", "ep": "傳統遠端文字操作協定，原生不加密通訊。", "o": "考古題", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "網際網路協定安全", "en": "IPsec, Internet Protocol Security", "cat": "加解密與金鑰生命週期", "ex": "像替道路上的貨車安排封箱與驗明來源機制。保護的是這條運輸路線上的貨物。", "ep": "在網路層保護 IP 通訊的安全協定組。", "o": "兩者", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "網際網路簡單金鑰管理", "en": "SKIP, Simple Key-management for Internet Protocols", "cat": "加解密與金鑰生命週期", "ex": "像舊式貨運事先約好封條製作方式。它是歷史方案，不能和後來的協議混為一談。", "ep": "早期用於保護 IP 通訊的金鑰管理方案。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "網際網路金鑰交換", "en": "IKE, Internet Key Exchange", "cat": "加解密與金鑰生命週期", "ex": "像兩家貨運站先約定用哪種封條和鑰匙。後續貨物才依約安全運送。", "ep": "為 IPsec 協商安全參數與金鑰的協定。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "網頁應用弱點掃描", "en": "Web Vulnerability Assessment", "cat": "事件與事故管理", "ex": "像特別檢查店面服務窗口是否有安全缺口。範圍聚焦在顧客操作的入口。", "ep": "檢查網站應用可能存在的弱點。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "線上憑證狀態協定", "en": "OCSP, Online Certificate Status Protocol", "cat": "加解密與金鑰生命週期", "ex": "像打電話向發證機關查證件是否已被作廢。不能只看卡面到期日。", "ep": "向服務查詢數位憑證是否仍有效的協定。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "縱深防禦", "en": "Defense in Depth; Layered Defense", "cat": "事件與事故管理", "ex": "像家中有圍牆、門鎖及警報器。即使越過一關，仍有其他保護。", "ep": "以多層不同防護降低單點失守的影響。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "蜜罐", "en": "Honeypot", "cat": "事件與事故管理", "ex": "像放置可追蹤的假錢箱。用來觀察竊賊行為，而非存放真正財物。", "ep": "誘使攻擊者接近以觀察手法的誘餌系統。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "行動備援站", "en": "Mobile Hot Site", "cat": "備援與營運持續", "ex": "像把完整廚房裝上餐車。需要時可開到合適地點繼續服務。", "ep": "把備援設備放在可移動車輛等設施的方案。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "認證機構能力認可", "en": "Accreditation", "cat": "相關法規概論與遵循", "ex": "像先確認驗屋公司本身具備檢查資格。它關心的是檢查者的能力。", "ep": "確認驗證或檢測機構有能力執行其工作。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "資料保護影響評估", "en": "DPIA, Data Protection Impact Assessment", "cat": "隱私權保護與智慧財產權", "ex": "像準備公開活動照片前先想誰可能因此受困擾。先找出影響再決定如何保護。", "ep": "事先評估個資處理對個人權益的風險。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "超文字傳輸協定", "en": "HTTP, Hypertext Transfer Protocol", "cat": "加解密與金鑰生命週期", "ex": "像店家與顧客約好訂購單格式。格式本身不會自動保護內容不被偷看。", "ep": "瀏覽器與網站交換網頁等內容的協定。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "跨站腳本攻擊", "en": "XSS, Cross-site Scripting", "cat": "事件與事故管理", "ex": "像把惡意指令混進店家的公告。讀公告的人誤以為那是店家授意。", "ep": "讓網站把攻擊者的程式當正常內容送給使用者執行。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "通行語", "en": "Passphrase", "cat": "存取控制與身分認證", "ex": "像用一段只有自己記得的句子當暗語。長度能增加猜中的難度。", "ep": "用較長詞句組成的登入秘密。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "量子運算", "en": "Quantum Computing", "cat": "加解密與金鑰生命週期", "ex": "像使用全新原理的解題工具。某些難題能更快處理，也影響部分舊鎖的安全。", "ep": "利用量子現象進行運算的技術。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "金鑰分配中心", "en": "KDC, Key Distribution Center", "cat": "存取控制與身分認證", "ex": "像票務中心確認資格後發給通行憑證。各場館信任這個中心的核發結果。", "ep": "協助分配驗證所需金鑰或票證的可信中心。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "金鑰加密金鑰", "en": "KEK, Key Encryption Key", "cat": "加解密與金鑰生命週期", "ex": "像用大保險箱保管一串小箱子的鑰匙。大箱的鑰匙須另外妥善保護。", "ep": "專門用來加密保護其他金鑰的金鑰。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "金鑰衍生函數", "en": "KDF, Key Derivation Function", "cat": "加解密與金鑰生命週期", "ex": "像把原料經過指定工序做成合尺寸的鑰匙。加入額外工序也能提高大量猜測的成本。", "ep": "由密碼或其他材料產生適用金鑰的函數。", "o": "兩者", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "金鑰配發", "en": "Key Distribution", "cat": "加解密與金鑰生命週期", "ex": "像把新家鑰匙交給家人。交付途中不能讓外人偷配。", "ep": "把正確金鑰安全交給需要使用者的過程。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "開源安全資訊管理系統", "en": "OSSIM, Open Source Security Information Management", "cat": "事件與事故管理", "ex": "像把多種保全工具集中到一個管理台。管理者較容易一起查看不同線索。", "ep": "整合安全監控與事件分析的開源平台。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "限制蒐集原則", "en": "Collection Limitati , "ex": "像依傷勢條件評估緊急程度。分數幫助排序，但仍要看實際情境。", "ep": "用共同指標評估漏洞嚴重性的制度。", "o": "考古題", "s": ["114-1", "112-2", "112-1", "109-2"], "w": 6, "r": 1, "h": ["114-2 科二（10/14） 第 15 題"]}, {"zh": "BitLocker 磁碟加密", "en": "BitLocker", "cat": "作業系統安全", "ex": "像替整個文件櫃上鎖。搬走櫃子的人仍不容易讀取裡面的文件。", "ep": "Windows 用來加密磁碟內容的功能。", "o": "考古題", "s": ["114-2", "113-2", "111-2"], "w": 6, "r": 2, "h": ["114-2 科二（10/14） 第 16 題"]}, {"zh": "動態分析", "en": "Dynamic Analysis", "cat": "程式與開發安全", "ex": "像讓機器運轉後觀察聲音與動作。才能看到運作時出現的異常。", "ep": "實際執行程式並觀察其行為。", "o": "兩者", "s": ["115-1", "110-2", "108-1"], "w": 6, "r": 1, "h": ["115-1 科二（9/14） 第 32 題"]}, {"zh": "3-2-1 備份原則", "en": "3-2-1 Backup Rule", "cat": "資料安全及備份管理", "ex": "像重要照片留原件與兩份副本，分別用不同載體。再把一份放到別處，避免同時受災。", "ep": "保留三份資料、兩種媒體，至少一份放異地。", "o": "考古題", "s": ["115-1", "113-1"], "w": 6, "r": 2, "h": ["115-1 科二（9/14） 第 35 題"]}, {"zh": "加殼", "en": "Packing", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像把文件套進多層包裝。必須拆開後才看得到真正內容。", "ep": "包裝或壓縮程式，使原內容較難直接分析。", "o": "考古題", "s": ["115-1", "113-2"], "w": 6, "r": 2, "h": ["115-1 科二（9/14） 第 22 題"]}, {"zh": "安全基準", "en": "Security Baseline", "cat": "作業系統安全", "ex": "像新房驗收表列出門鎖與警報最低要求。每戶都照同一份清單檢查。", "ep": "系統至少應符合的一組安全設定要求。", "o": "考古題", "s": ["115-1", "113-1"], "w": 6, "r": 2, "h": ["115-1 科二（9/14） 第 17 題"]}, {"zh": "政府組態基準", "en": "GCB, Government Configuration Baseline", "cat": "作業系統安全", "ex": "像主管機關公布的建築安全檢查表。各單位依同一標準調整設施。", "ep": "政府制定的系統安全設定基準。", "o": "考古題", "s": ["115-1", "113-1"], "w": 6, "r": 2, "h": ["115-1 科二（9/14） 第 33 題"]}, {"zh": "軟體物料清單", "en": "SBOM, Software Bill of Materials", "cat": "程式與開發安全", "ex": "像食品包裝上的成分與批號表。某原料出問題時能追查哪些產品受影響。", "ep": "列出軟體所含元件、版本與相關資訊的清單。", "o": "考古題", "s": ["115-1", "113-2"], "w": 6, "r": 2, "h": ["115-1 科二（9/14） 第 29 題"]}, {"zh": "去識別化", "en": "De-identification", "cat": "資料安全及備份管理", "ex": "像公開問卷時先遮住姓名與電話。只遮姓名還不夠，生日加地址也可能認出人。", "ep": "處理個資使其無法直接或間接識別特定個人", "o": "兩者", "s": ["111-2", "110-2", "110-1", "109-1", "樣題1"], "w": 5, "r": 0, "h": ["115-1 科一（9/10） 第 13 題"]}, {"zh": "IP 設定查詢", "en": "ipconfig", "cat": "惡意程式防護與弱點管理", "ex": "像打開住戶登記卡查看門牌與聯絡資訊。先確認自己目前的地址。", "ep": "查看或管理 Windows 網路位址設定的指令。", "o": "考古題", "s": ["115-1", "111-1"], "w": 5, "r": 1, "h": ["115-1 科二（9/14） 第 11 題"]}, {"zh": "冷備援場所", "en": "Cold Site", "cat": "資料安全及備份管理", "ex": "像先租好空店面。真的要營業時仍要裝設備與進貨。", "ep": "備有基本場地，災後仍需裝設系統與恢復資料。", "o": "考古題", "s": ["115-1", "112-2"], "w": 5, "r": 1, "h": ["115-1 科二（9/14） 第 36 題"]}, {"zh": "熱備援場所", "en": "Hot Site / Hot Backup", "cat": "資料安全及備份管理", "ex": "像備用店已有人員與可用設備。主店出事時能很快移過去營業。", "ep": "備妥運作設備與資料，可較快接手服務。", "o": "考古題", "s": ["115-1", "112-2"], "w": 5, "r": 1, "h": ["115-1 科二（9/14） 第 36 題"]}, {"zh": "誤報", "en": "False Positive", "cat": "日誌管理", "ex": "像門鈴把家貓走過當成小偷。警報響了，實際卻沒有入侵。", "ep": "把正常活動誤認為威脅。", "o": "考古題", "s": ["114-2", "113-1"], "w": 5, "r": 2, "h": ["114-2 科二（10/14） 第 5 題"]}, {"zh": "通用弱點列舉", "en": "CWE, Common Weakness Enumeration", "cat": "程式與開發安全", "ex": "像把房屋缺陷分成漏水、裂縫等類型。類型不是某一棟樓的個別案號。", "ep": "為軟硬體常見缺陷類型建立一致分類的清單。", "o": "考古題", "s": ["114-1", "111-2"], "w": 4, "r": 1, "h": ["114-1 科二（10/18） 第 30 題"]}, {"zh": "金鑰雜湊訊息鑑別碼", "en": "HMAC, Hash-based Message Authentication Code", "cat": "資料安全及備份管理", "ex": "像雙方使用共同暗號製作封條。只有知道暗號的人能做出可核對封條。", "ep": "結合秘密金鑰與雜湊，驗證資料完整性及來源。", "o": "考古題", "s": ["114-1", "111-1"], "w": 4, "r": 1, "h": ["114-1 科二（10/18） 第 7 題"]}, {"zh": "零日攻擊", "en": "Zero-day Attack", "cat": "惡意程式防護與弱點管理", "ex": "像小偷在新鎖缺陷剛曝光時就下手。屋主還來不及換上修正零件。", "ep": "利用尚未有適當修補的未知或新揭露漏洞攻擊。", "o": "兩者", "s": ["114-2", "樣題2"], "w": 4, "r": 1, "h": ["114-2 科二（10/14） 第 5 題"]}, {"zh": "DHCP 監聽防護", "en": "DHCP Snooping", "cat": "通訊安全", "ex": "像只准正式櫃檯分配房號。陌生人亂發房卡會被攔下。", "ep": "區分可信 DHCP 來源並建立位址綁定資訊的防護。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 5 題"]}, {"zh": "WPA3", "en": "WPA3, Wi-Fi Protected Access 3", "cat": "通訊安全", "ex": "像改用更難被複製的門禁系統。仍須正確設定才能發揮保護。", "ep": "強化無線認證與加密保護的新一代標準。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 7 題"]}, {"zh": "WPA3 過渡模式", "en": "WPA3 Transition Mode", "cat": "通訊安全", "ex": "像新舊門禁在過渡期都能進門。便利舊證件，也保留了舊機制風險。", "ep": "同時容納 WPA2 與 WPA3 裝置的相容模式。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 13 題"]}, {"zh": "中介軟體", "en": "Middleware", "cat": "程式與開發安全", "ex": "像餐廳內場與外場之間的傳菜員。幫不同角色順利交接。", "ep": "在不同應用或系統元件間提供協調服務的軟體。", "o": "兩者", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 18 題"]}, {"zh": "伽羅瓦計數器模式", "en": "GCM, Galois/Counter Mode", "cat": "資料安全及備份管理", "ex": "像箱子既上鎖又有可核對的防拆封條。兼顧不被偷看與發現竄改。", "ep": "同時提供加密與完整性驗證的區塊加密模式。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 12 題"]}, {"zh": "動態連結程式庫側載", "en": "DLL Sideloading", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像把假零件放在師傅優先取料的位置。師傅照正常流程也會裝進假貨。", "ep": "誘使合法程式載入假冒的程式庫。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 22 題"]}, {"zh": "原生 VLAN", "en": "Native VLAN", "cat": "網路安全", "ex": "像共用走道規定沒貼部門標籤的貨都送某一區。規則不一致時可能送錯。", "ep": "中繼連線中處理未帶標籤流量的 VLAN。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 3 題"]}, {"zh": "同等者同步認證", "en": "SAE, Simultaneous Authentication of Equals", "cat": "通訊安全", "ex": "像兩人確認知道同一秘密卻不直接說出秘密。旁聽者較難靠錄音猜答案。", "ep": "WPA3 個人模式用來安全協商密碼驗證的機制。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 7 題"]}, {"zh": "存取連接埠", "en": "Access Port", "cat": "網路安全", "ex": "像只通往一個部門的專用窗口。收到的貨通常都歸同一區。", "ep": "通常供終端裝置接入單一 VLAN 的埠。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 3 題"]}, {"zh": "密碼區塊連結模式", "en": "CBC, Cipher Block Chaining", "cat": "資料安全及備份管理", "ex": "像每個箱子的封印都參照前箱封印製作。各箱不再獨立用同一方式處理。", "ep": "讓每個加密區塊與前一區塊相關聯的模式。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（9/14） 第 12 題"]}, {"zh": "帶內 SQL 注入", "en": "In-band SQL Injection", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像在櫃檯遞出假指示，當場拿回文件。要求與回覆都走同一窗口。", "ep": "透過同一通道發動注入並取得查詢結果。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": ["115-1 科二（10/12） 第 20 題"]}, {"zh": "帶外 SQL 注入", "en": "Out-of-band SQL Injection", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像櫃檯不肯口頭回答，就誘使它寄明信片到別處。資料從另一條路流出去。", " w": 4, "r": 0, "h": []}, {"zh": "私有 IP 位址", "en": "Private IP Address", "cat": "通訊安全", "ex": "像公司內部的房間號碼。不同公司都能有同一個房號。", "ep": "供內部網路使用、不在公網直接路由的位址。", "o": "兩者", "s": ["111-2", "110-2", "110-1", "108-1"], "w": 4, "r": 0, "h": []}, {"zh": "程式碼審查", "en": "Source Code Review", "cat": "程式與開發安全", "ex": "像在施工前逐頁檢查建築圖。先發現圖上不合理的地方。", "ep": "檢查程式原始內容，找出缺陷與安全問題。", "o": "兩者", "s": ["112-1", "111-2", "110-2", "109-1"], "w": 4, "r": 0, "h": []}, {"zh": "美國國家標準暨技術研究院", "en": "NIST, National Institute of Standards and Technology", "cat": "雲端安全概論", "ex": "像提供統一量尺與檢查方法的研究單位。讓不同組織能用共同標準討論。", "ep": "制定與研究技術標準、發布資安指引的美國機構。", "o": "兩者", "s": ["112-2", "111-1", "110-2", "樣題1"], "w": 4, "r": 0, "h": []}, {"zh": "蟲洞攻擊", "en": "Wormhole Attack", "cat": "物聯網安全概論", "ex": "像兩地有人私設快速暗道。大家誤以為兩地很近，就把貨交給他們。", "ep": "串通節點以捷徑轉送資料，扭曲網路路徑認知。", "o": "兩者", "s": ["110-2", "110-1", "109-2", "樣題1"], "w": 4, "r": 0, "h": []}, {"zh": "輕量型目錄存取協定", "en": "LDAP, Lightweight Directory Access Protocol", "cat": "作業系統安全", "ex": "像各部門依共同格式查員工名冊。需要找人或核對資格時都查同一處。", "ep": "查詢與管理集中式目錄資料的協定。", "o": "兩者", "s": ["111-2", "111-1", "109-1", "樣題2"], "w": 4, "r": 0, "h": []}, {"zh": "金鑰淪陷攻擊", "en": "Compromised-key Attack", "cat": "網路安全", "ex": "像小偷複製了保險箱鑰匙。即使箱子看起來完好，也能偷偷打開。", "ep": "取得遭洩漏的金鑰後解讀或偽造資料。", "o": "兩者", "s": ["109-2", "109-1", "108-1", "樣題2"], "w": 4, "r": 0, "h": []}, {"zh": "除錯器", "en": "Debugger", "cat": "程式與開發安全", "ex": "像讓輸送帶暫停，檢查每站的物品。可一步步找到出錯位置。", "ep": "控制程式執行並觀察內部狀態的工具。", "o": "考古題", "s": ["111-2", "111-1", "107-1", "樣題2"], "w": 4, "r": 0, "h": []}, {"zh": "電子簽章", "en": "Electronic Signature", "cat": "資料安全及備份管理", "ex": "像在電子同意書留下可辨識的簽署記號。具體做法不一定都是同一種印章。", "ep": "附於電子文件、表達簽署身分或意願的電子證明。", "o": "兩者", "s": ["109-1", "107-1", "樣題2", "樣題1"], "w": 4, "r": 0, "h": []}, {"zh": "Bash 歷程紀錄", "en": "Bash History, .bash_history", "cat": "作業系統安全", "ex": "像廚房留下做菜步驟的筆記。可回頭看之前做過什麼。", "ep": "記錄使用者曾在 Bash 輸入的命令。", "o": "兩者", "s": ["113-2", "109-2", "樣題1"], "w": 4, "r": 1, "h": []}, {"zh": "Nessus 弱點掃描", "en": "Nessus", "cat": "惡意程式防護與弱點管理", "ex": "像按完整清單檢查房屋常見瑕疵。掃出疑點後仍應核實。", "ep": "偵測主機與服務已知弱點的工具。", "o": "考古題", "s": ["113-1", "112-2", "樣題2"], "w": 4, "r": 1, "h": []}, {"zh": "SYN 洪水攻擊", "en": "SYN Flood", "cat": "網路安全", "ex": "像不斷預約座位卻不來確認。餐廳保留太多空桌而無法接客。", "ep": "大量提出卻不完成連線，耗盡等待資源。", "o": "兩者", "s": ["113-2", "110-2", "110-1"], "w": 4, "r": 1, "h": []}, {"zh": "UDP 洪水攻擊", "en": "UDP Flood", "cat": "網路安全", "ex": "像不停往門口丟信件。住戶忙著清理，連正常郵件也收不了。", "ep": "大量傳送 UDP 封包以壓垮服務或網路。", "o": "兩者", "s": ["113-2", "111-1", "110-2"], "w": 4, "r": 1, "h": []}, {"zh": "模糊測試", "en": "Fuzz Testing / Fuzzing", "cat": "程式與開發安全", "ex": "像往自動販賣機投入各種奇怪形狀的代幣。觀察它會安全拒絕還是卡住。", "ep": "大量輸入異常或變異資料，尋找程式缺陷。", "o": "兩者", "s": ["113-1", "110-1", "樣題2"], "w": 4, "r": 1, "h": []}, {"zh": "無線基地台", "en": "AP, Access Point", "cat": "通訊安全", "ex": "像社區的公共入口。從這裡加入才能前往裡面的設施。", "ep": "讓無線裝置接入網路的設備。", "o": "兩者", "s": ["113-2", "110-2", "110-1"], "w": 4, "r": 1, "h": []}, {"zh": "輸入驗證", "en": "Input Validation", "cat": "程式與開發安全", "ex": "像櫃檯收申請前核對日期與欄位。奇怪或不合規的內容先退回。", "ep": "檢查外來資料是否符合允許的格式與範圍。", "o": "兩者", "s": ["113-1", "110-2", "樣題2"], "w": 4, "r": 1, "h": []}, {"zh": "遠端桌面協定", "en": "RDP, Remote Desktop Protocol", "cat": "通訊安全", "ex": "像人在外地仍能透過助手操作家中工作桌。眼前看到的仍是那張桌子的狀況。", "ep": "讓人從遠端查看並操作另一台裝置的桌面。", "o": "兩者", "s": ["113-1", "112-1", "110-2"], "w": 4, "r": 1, "h": []}, {"zh": "DNS 安全擴充", "en": "DNSSEC, Domain Name System Security Extensions", "cat": "通訊安全", "ex": "像電話簿每頁都有可核對的官方封印。可發現號碼是否被偷換。", "ep": "用數位簽章驗證 DNS 資料來源與完整性。", "o": "考古題", "s": ["114-2", "112-2"], "w": 4, "r": 1, "h": []}, {"zh": "Java 程式語言", "en": "Java", "cat": "程式與開發安全", "ex": "像可在多種工廠採用的作業描述方式。各工廠有相應設備就能依規則執行。", "ep": "常用於跨平台應用程式的程式語言。", "o": "考古題", "s": ["114-2", "111-1"], "w": 4, "r": 1, "h": []}, {"zh": "NTLM 認證", "en": "NTLM, NT LAN Manager", "cat": "作業系統安全", "ex": "像門衛出題、來客依秘密回答。並非直接把秘密寫在門外。", "ep": "Windows 使用的挑戰回應式認證協定家族。", "o": "考古題", "s": ["113-2", "113-1"], "w": 4, "r": 2, "h": []}, {"zh": "fail2ban 防護工具", "en": "fail2ban", "cat": "作業系統安全", "ex": "像有人反覆按  "en": "Keylogging / Keystroke Logging", "cat": "惡意程式防護與弱點管理", "ex": "像有人站在旁邊抄下你打開門鎖時按的數字。密碼再難，輸入過程被記下仍有風險。", "ep": "記錄按鍵輸入，可能用來竊取密碼等資料。", "o": "考古題", "s": ["114-1", "112-2"], "w": 4, "r": 1, "h": []}, {"zh": "間諜軟體", "en": "Spyware", "cat": "惡意程式防護與弱點管理", "ex": "像偷偷在房間裝錄音機。屋主照常生活，活動卻被記下。", "ep": "在不知情或未同意下蒐集使用者資訊。", "o": "兩者", "s": ["114-1", "樣題2"], "w": 4, "r": 1, "h": []}, {"zh": "AI 資安監控代理", "en": "AI SOC Agent", "cat": "物聯網安全概論", "ex": "像值班室多一位會整理線索的助手。重要處置仍可安排主管核准。", "ep": "協助資安中心分析與處理事件的 AI 代理。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "BGP 劫持", "en": "BGP Hijacking", "cat": "網路安全", "ex": "像冒名公告某區貨物改交到自己的倉庫。相信公告的人就把貨送錯地方。", "ep": "發布不當路由宣告，將網路流量引向錯誤路徑。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "HTTP 請求走私", "en": "HTTP Request Smuggling", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像兩位驗票員對一張票包含幾人認定不同。有人便趁交接混亂多帶一人進場。", "ep": "利用前後端解析邊界不同，夾帶額外請求。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "PMD 原始碼分析", "en": "PMD", "cat": "程式與開發安全", "ex": "像檢查食譜是否漏步驟或重複抄寫。先把可疑之處圈出來。", "ep": "分析原始碼缺陷、壞味道與重複程式碼的工具。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "Sysmon 系統監控", "en": "Sysmon, System Monitor", "cat": "日誌管理", "ex": "像對每件工作記下誰開始、交給誰、做了什麼。細節能幫助追查異常。", "ep": "記錄 Windows 處理程序等詳細活動的監控工具。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "中繼連接埠", "en": "Trunk Port", "cat": "網路安全", "ex": "像同一條貨道同時運不同部門的包裹。靠標籤區分各自目的地。", "ep": "在同一連線攜帶多個 VLAN 流量的埠。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "人工智慧", "en": "AI, Artificial Intelligence", "cat": "物聯網安全概論", "ex": "像讓助手從許多例子學會分類物品。仍可能看錯，需要核對重要結果。", "ep": "讓機器進行辨識、推論或產生內容的技術。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "共同責任模式", "en": "Shared Responsibility Model", "cat": "雲端安全概論", "ex": "像租屋合約分清房東維修結構、房客鎖好房門。不能以為付租金就什麼都由房東負責。", "ep": "依服務模式分配雲端業者與客戶的安全責任。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "區塊鏈", "en": "Blockchain", "cat": "物聯網安全概論", "ex": "像多家商店共同保留相互連結的帳頁。偷偷改舊頁會讓後續對照出現異常。", "ep": " y Policy", "cat": "作業系統安全", "ex": "像單一店長訂定店內門禁要求。作用範圍是這一家店。", "ep": "設定單一 Windows 裝置的安全規則。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "核心位址配置隨機化", "en": "KASLR, Kernel Address Space Layout Randomization", "cat": "作業系統安全", "ex": "像把機房重要開關的位置隨機換置。攻擊者不能只靠舊圖紙下手。", "ep": "隨機安排核心位置，降低猜中攻擊位址的機會。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "橢圓曲線密碼學", "en": "ECC, Elliptic Curve Cryptography", "cat": "資料安全及備份管理", "ex": "像設計一條易走卻難倒推起點的數學路徑。用較短的線索也能建立強保護。", "ep": "利用橢圓曲線數學難題的公開金鑰技術。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "營運技術", "en": "OT, Operational Technology", "cat": "物聯網安全概論", "ex": "像控制水廠泵浦與閥門的系統。故障可能讓現實中的供水停止。", "ep": "直接監控或改變實體設備與流程的技術。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "營運持續計畫", "en": "BCP, Business Continuity Plan", "cat": "資料安全及備份管理", "ex": "像店家規劃停電時如何接單與供餐。先決定哪些工作一定要繼續。", "ep": "預先安排中斷時如何維持或恢復重要業務。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "登錄檔自動啟動項", "en": "Run / RunOnce Registry Keys", "cat": "作業系統安全", "ex": "像在每天開店清單加上一項工作。若被偷加指示，隔天又會自動照做。", "ep": "Windows 讓程式在登入等時機自動執行的設定。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "系統呼叫", "en": "System Call, syscall", "cat": "作業系統安全", "ex": "像住戶向管理室提出維修申請。不能自行闖入機房亂動設備。", "ep": "程式向作業系統核心提出服務要求的方式。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "統一端點管理", "en": "UEM, Unified Endpoint Management", "cat": "行動裝置安全概論", "ex": "像同一總務窗口管理各種公司交通工具。規則可統一查看與套用。", "ep": "用同一平台管理手機、電腦等多種端點。", "o": "考古題", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "網路隔離", "en": "Network Isolation", "cat": "網路安全", "ex": "像把生病的盆栽移到另一間房。避免蟲害傳到其他植物。", "ep": "切斷或限制裝置與其他網路的聯繫。", "o": "兩者", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "自動執行", "en": "Autorun", "cat": "作業系統安全", "ex": "像客人一放下包裹，門就自動打開。方便之外也要防止陌生包裹觸發危險。", "ep": "插入媒體等事件發生時，自動啟動指定程式。", "o": "兩者", "s": ["115-1"], "w": 4, "r": 1, "h": []}, {"zh": "處理程序樹", "en": "Process Tree", "cat": "日誌管理", "ex": "像家族樹記下每個任務的上下來源。能看出平常工具是否被奇怪的人指使。", "ep": "呈現程式由誰啟動、 n": "Botnet", "cat": "惡意程式防護與弱點管理", "ex": "像很多被遙控的玩偶聽同一人指令。可以一起去堵住某家店的門。", "ep": "由攻擊者集中控制的大量受感染裝置。", "o": "兩者", "s": ["113-2", "112-1"], "w": 3, "r": 1, "h": []}, {"zh": "無線射頻識別", "en": "RFID, Radio-frequency Identification", "cat": "行動裝置安全概論", "ex": "像不用直接接觸就能讀取物品名牌。常用來辨認貨物或通行物件。", "ep": "以無線訊號讀取標籤中的識別資訊。", "o": "考古題", "s": ["113-2", "112-1"], "w": 3, "r": 1, "h": []}, {"zh": "網路時間協定", "en": "NTP, Network Time Protocol", "cat": "日誌管理", "ex": "像所有分店每天對同一座標準鐘。不同紀錄才能排出正確先後。", "ep": "協調網路裝置時鐘的通訊協定。", "o": "考古題", "s": ["113-1", "109-2"], "w": 3, "r": 1, "h": []}, {"zh": "資料推論", "en": "Database Inference", "cat": "資料安全及備份管理", "ex": "像知道一班總分與其他同學分數。就能推回最後一人的分數。", "ep": "從允許查閱的資料推導出未直接公開的資訊。", "o": "考古題", "s": ["113-2", "111-2"], "w": 3, "r": 1, "h": []}, {"zh": "資訊安全管理系統標準", "en": "ISO/IEC 27001 / CNS 27001, ISMS Requirements", "cat": "日誌管理", "ex": "像一套公司安全管理的驗收標準。除了設備，也看責任、流程與持續改善。", "ep": "規定建立、維護與改善資訊安全管理系統的要求。", "o": "考古題", "s": ["113-1", "樣題2"], "w": 3, "r": 1, "h": []}, {"zh": "邏輯炸彈", "en": "Logic Bomb", "cat": "惡意程式防護與弱點管理", "ex": "像先藏好一個定時機關。平時沒動靜，到設定時刻才發作。", "ep": "到特定時間或條件才啟動的惡意程式碼。", "o": "兩者", "s": ["113-1", "樣題2"], "w": 3, "r": 1, "h": []}, {"zh": "預設設定", "en": "Default Settings", "cat": "物聯網安全概論", "ex": "像新房交付時每戶都用同款預設鎖。入住後應依需要調整保護。", "ep": "裝置或軟體出廠時預先提供的設定。", "o": "兩者", "s": ["113-1", "112-1"], "w": 3, "r": 1, "h": []}, {"zh": "髒牛漏洞", "en": "Dirty COW", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像有人趁影印與核對交接時偷換原件。最後取得本不該修改的內容。", "ep": "利用 Linux 核心寫入時複製缺陷的提權漏洞。", "o": "考古題", "s": ["113-1", "112-1"], "w": 3, "r": 1, "h": []}, {"zh": "點擊劫持", "en": "Clickjacking", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像透明板下放著另一張同意書。你以為在簽收，實際蓋到別份文件。", "ep": "用遮蓋或偽裝介面，騙人點到隱藏操作。", "o": "兩者", "s": ["113-2", "110-1"], "w": 3, "r": 1, "h": []}, {"zh": "Android 安裝套件", "en": "APK, Android Package", "cat": "行動裝置安全概論", "ex": "像把工具與零件包成一盒交給你組裝。來源不明的盒子可能藏有危險物。", "ep": "封裝 Android 應用程式與所需資源的安裝檔。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "BD-R 藍光光碟", "en": "BD-R, Blu-ray 114-1"], "w": 3, "r": 1, "h": []}, {"zh": "動態應用安全測試", "en": "DAST, Dynamic Application Security Testing", "cat": "程式與開發安全", "ex": "像餐廳營業流程啟動後扮演客人試單。觀察真實回應是否有漏洞。", "ep": "對運作中的應用程式進行安全測試。", "o": "考古題", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "商業電子郵件詐騙", "en": "BEC, Business Email Compromise", "cat": "網路安全", "ex": "像假冒供應商說收款帳戶已變更。承辦人未核實就可能把款項匯給騙子。", "ep": "冒充商業往來對象，誘導轉帳或交付敏感資料。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "存取控制清單", "en": "ACL, Access Control List", "cat": "通訊安全", "ex": "像門衛手上的通行清單。寫明誰能去哪裡、做什麼。", "ep": "列出允許或拒絕哪些對象進行哪些存取。", "o": "兩者", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "工作排程器", "en": "Task Scheduler", "cat": "作業系統安全", "ex": "像設定鬧鐘提醒並安排固定家務。時間到了就按計畫開始。", "ep": "按時間或事件自動啟動工作的系統工具。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "廣告軟體", "en": "Adware", "cat": "惡意程式防護與弱點管理", "ex": "像有人一直往你的工作桌塞廣告單。有些經你同意，有些卻擅自打擾。", "ep": "顯示或插入廣告的軟體，可能伴隨追蹤或干擾。", "o": "考古題", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "快照", "en": "Snapshot", "cat": "資料安全及備份管理", "ex": "像拍下房間當下擺設的照片。之後可參照那一刻的樣貌還原。", "ep": "保存某個時間點的資料或系統狀態。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "感測器", "en": "Sensor", "cat": "物聯網安全概論", "ex": "像用溫度計感覺環境冷熱。它負責觀察，不是直接改變環境。", "ep": "把溫度、位置等實體狀態轉成可處理資料的元件。", "o": "兩者", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "推測執行", "en": "Speculative Execution", "cat": "作業系統安全", "ex": "像先替可能到店的客人備好食材。猜錯時表面工作可取消，但仍可能留下痕跡。", "ep": "處理器先執行預測可能需要的工作以提升速度。", "o": "考古題", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "格林威治標準時間", "en": "GMT, Greenwich Mean Time", "cat": "日誌管理", "ex": "像約定所有人參照同一地點的鐘。紀錄時仍要清楚標示時間基準。", "ep": "以格林威治為基準的時間表示。", "o": "考古題", "s": ["114-1"], "w": 3, "r": 1, "h": []}, {"zh": "橫向移動", "en": "Lateral Movement", "cat": "網路安全", "ex": "像小偷進了大樓後逐戶找入口。不是只停留在最初那個房間。", "ep": "入侵一處後，再移往其他主機或帳號。", "o": "考古題", "s": ["114-2"], "w": 3, "r": 1, "h": []}, {"zh": "次世代防火牆", "en": "NGFW, Next-Generation Firewall", "cat": "網路安全", "ex": "像新式門禁除了驗票，還能辨認可疑行為。遇到異常會進一步攔查。", "ep": "結合應用辨識與進階威脅防護 與弱點管理", "ex": "像先看傷口本身深度與位置。先不考慮醫院遠近。", "ep": "衡量漏洞本身較固定的嚴重性特徵。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "CVSS 時間指標", "en": "CVSS Temporal Metrics", "cat": "惡意程式防護與弱點管理", "ex": "像藥物是否已經到貨會改變處置條件。傷口本身沒變，應對情況可能變了。", "ep": "在 CVSS 3.1 中反映隨時間變化的漏洞因素。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "CVSS 環境指標", "en": "CVSS Environmental Metrics", "cat": "惡意程式防護與弱點管理", "ex": "像同樣停水，餐廳與空屋受影響不同。要考慮當地實際需求。", "ep": "依組織環境與重要性調整漏洞評估。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "DVD 光碟", "en": "DVD, Digital Versatile Disc", "cat": "資料安全及備份管理", "ex": "像用光讀取內容的薄型資料冊。用磁鐵不會像磁帶那樣有效清除。", "ep": "用光學方式記錄資料的光碟格式。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "ELF 執行檔格式", "en": "ELF, Executable and Linkable Format", "cat": "作業系統安全", "ex": "像另一套工廠採用的指令本格式。要由理解該格式的環境處理。", "ep": "Linux 等系統常用的執行檔與物件檔格式。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "ESTABLISHED 狀態", "en": "ESTABLISHED", "cat": "通訊安全", "ex": "像雙方已確認通話成功。現在可以正式談事情。", "ep": "TCP 連線已建立，可正式交換資料的狀態。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "Fraggle 攻擊", "en": "Fraggle Attack", "cat": "網路安全", "ex": "像冒用鄰居地址請許多店家寄試用品。大量回件就塞滿他的門口。", "ep": "利用 UDP 回應與廣播流量淹沒受害者。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "Hibernate 注入", "en": "Hibernate Query Injection", "cat": "程式與開發安全", "ex": "像利用代辦窗口的查詢規則夾帶額外要求。即使換了中間人，輸入仍須分清資料與指令。", "ep": "操控 Hibernate 查詢語句以存取非預期資料。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "ICMP 洪水攻擊", "en": "ICMP Flood", "cat": "網路安全", "ex": "像一群人不斷按門鈴問有人嗎。主人光回應就無法做正事。", "ep": "用大量網路診斷訊息消耗目標資源。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "IP 位址偽冒", "en": "IP Spoofing", "cat": "網路安全", "ex": "像寄信時填上別人的寄件地址。收件人因而誤認來源。", "ep": "把封包的來源位址改成別人的位址。", "o": "兩者", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "IPsec 傳輸模式", "en": "IPsec Transport Mode", "cat": "通訊安全", "ex": "像替信封裡的信紙加保護。外面的投遞地址仍看得到。", "ep": "保護原始 IP 封包內的負載，保留原位址標頭。", "o": "考古題", "s": ["108-1"], "w": 1, "r" 訊安全", "ex": "像店家已回覆有位子，正等客人確認。最後答覆到達才算完成。", "ep": "TCP 已回覆連線要求，等待最後確認的狀態。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "SYN-SENT 狀態", "en": "SYN-SENT", "cat": "通訊安全", "ex": "像已送出訂位申請但店家還沒回覆。此時還不能當成訂位完成。", "ep": "TCP 已提出連線要求，正在等待回覆的狀態。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "Scapy 封包工具", "en": "Scapy", "cat": "惡意程式防護與弱點管理", "ex": "像可自己拼裝測試包裹的工作台。能安排特殊形狀觀察投遞結果。", "ep": "以程式製作、傳送與解析網路封包的工具。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "Shell 清單檔", "en": "/etc/shells", "cat": "作業系統安全", "ex": "像櫃檯核准的服務窗口清單。不是所有臨時窗口都能辦正式手續。", "ep": "列出系統認可登入命令環境的檔案。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "Shellshock 漏洞", "en": "Shellshock", "cat": "程式與開發安全", "ex": "像把門口告示誤當成店長指令。外人寫的文字因此能指揮內部工作。", "ep": "Bash 處理環境變數時可觸發命令執行的漏洞。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "Slowloris 攻擊", "en": "Slowloris", "cat": "網路安全", "ex": "像打電話訂位卻一直不把姓名說完。店員只好一直拿著電話等。", "ep": "慢慢傳送不完整請求標頭，佔住網站連線。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "TCP 序號", "en": "TCP Sequence Number", "cat": "網路安全", "ex": "像把連載信件每頁編上頁碼。收到時可排順序並知道缺哪頁。", "ep": "標記 TCP 資料位元組位置，供排序與確認。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "Tcpreplay 封包重播", "en": "Tcpreplay", "cat": "惡意程式防護與弱點管理", "ex": "像把錄好的交通情境重新演出。可觀察新措施面對同樣狀況的反應。", "ep": "重播先前擷取封包以測試網路的工具。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "Tor 洋蔥路由", "en": "Tor, The Onion Router", "cat": "通訊安全", "ex": "像信件套多層信封並經多人轉交。每位轉交者只知道前後一站。", "ep": "透過多層轉送，降低連線來源被追查的機會。", "o": "考古題", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "Visual Basic 指令碼", "en": "VBScript, Visual Basic Scripting Edition", "cat": "程式與開發安全", "ex": "像舊式辦公流程常用的短操作單。來源不明的單子也可能叫人做壞事。", "ep": "曾廣泛用於 Windows 自動化的指令碼語言。", "o": "兩者", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "Windows 更新服務", "en": "WSUS, Windows Server Update Services", "cat": "作業系統安全", "ex": "像總部統一發送各分店所需的新規章。每家店的更新情況都能追蹤。", "ep": "集中派送與管理 Windows 更新的服務。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "XML 外部實體攻擊", "en": "XXE, XML External Entity Attack", "cat": "程式與開發安全", "ex": "像收到表格後被要求去密室取附件。承辦人照做就可能洩漏機密。", "ep": "利用 XML 外部參照讀取檔案或存取非預期資源。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "hping 封包工具", "en": "hping", "cat": "惡意程式防護與弱點管理", "ex": "像可自訂各種尺寸信封的測試器。用不同樣式檢查收件設備反應。", "ep": "製作與傳送自訂封包的網路測試工具。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "ngrep 封包搜尋", "en": "ngrep, Network Grep", "cat": "惡意程式防護與弱點管理", "ex": "像從大量錄下的對話找某一句話。可快速找到相關片段。", "ep": "在網路封包內容中尋找指定文字或樣式。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "sudo 授權設定檔", "en": "/etc/sudoers", "cat": "作業系統安全", "ex": "像特別授權清單。寫清楚誰能借主管印章辦哪件事。", "ep": "規定哪些人可透過 sudo 執行哪些命令。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "中國菜刀", "en": "China Chopper", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像透過一個藏起來的小傳話口指揮屋內的人。門面看起來正常，內部卻被操控。", "ep": "以網頁後門遠端控制伺服器的工具。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "中斷攻擊", "en": "Interruption", "cat": "網路安全", "ex": "像有人剪斷社區供水管。住戶想用水也用不到。", "ep": "讓資料傳遞或服務無法繼續。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "中斷點", "en": "Breakpoint", "cat": "程式與開發安全", "ex": "像在生產線某站設停車點。走到那裡就停下來檢查。", "ep": "讓程式執行到指定位置時暫停的設定。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "串列線網際網路協定", "en": "SLIP, Serial Line Internet Protocol", "cat": "通訊安全", "ex": "像用一條單線走道逐件運送包裹。所有東西依序通過同一通道。", "ep": "讓 IP 資料在串列連線上傳送的舊協定。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "主機名稱對照檔", "en": "/etc/hosts", "cat": "作業系統安全", "ex": "像桌上自備的小本電話簿。查詢時可先依自己的對照表找到對方。", "ep": "在本機記錄名稱與 IP 位址對照的檔案。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "交易記錄備份", "en": "Transaction Log Backup", "cat": "資料安全及備份管理", "ex": "像把每筆帳目變動另存一份。可從原帳本接著補到指定時刻。", "ep": "備份資料庫變更記錄，以供較細時間點的復原。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "低功耗藍牙", "en": "BLE, Bluetooth Low Energy", "cat": "行動裝置安全概論", "ex": "像使用省電小鈴鐺傳遞簡短通知。適合需要長時間待命的小物件。", "ep": "以較低電力進行短距離無線通訊的藍牙技術。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "保護環", "en": "Protection Rings", "cat": "作業系統安全", "ex": "像醫院由公共大廳到手術室分層管制。越重要的區域，權限越嚴格。", "ep": "把系統操作分成不同權限層級的機制。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "儲存區域網路", "en": "SAN, Storage Area Network", "cat": "資料安全及備份管理", "ex": "像各辦公室連到專用的倉儲運送通道。大家能使用遠端安排的儲物空間。", "ep": "以網路提供磁碟區塊等儲存存取的架構。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "入侵指標", "en": "IOC, Indicators of Compromise", "cat": "惡意程式防護與弱點管理", "ex": "像門鎖刮痕與屋內陌生腳印。它們提示可能有人闖進來過。", "ep": "顯示可能已遭入侵的具體痕跡。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "公認通訊埠", "en": "Well-known Port", "cat": "通訊安全", "ex": "像大家熟悉的緊急服務短號碼。看到號碼就能知道通常是什麼用途。", "ep": "編號 0 到 1023、常用於既定服務的通訊埠。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "分時系統", "en": "Time-sharing System", "cat": "作業系統安全", "ex": "像大家輪流使用一台洗衣機。每人分到一段時間。", "ep": "把處理時間切片，輪流提供給不同工作。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "初始化向量", "en": "IV, Initialization Vector", "cat": "資料安全及備份管理", "ex": "像同一套暗語每次搭配不同起始記號。避免相同內容總產生相同外觀。", "ep": "加密時搭配金鑰使用的起始值。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "加密型病毒", "en": "Encrypted Virus", "cat": "惡意程式防護與弱點管理", "ex": "像把危險指示藏在暗語信中。外人不拆解就較難看懂。", "ep": "把主要內容加密以降低直接辨識機會的病毒。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "動態中繼協定", "en": "DTP, Dynamic Trunking Protocol", "cat": "通訊安全", "ex": "像兩棟樓商量走廊是否可同時運送不同部門的貨。協商結果決定通道用途。", "ep": "Cisco 交換器間協商 VLAN 中繼連線的協定。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "半開連線", "en": "Half-open Connection", "cat": "通訊安全", "ex": "像只先留下訂位姓名卻未完成確認。店家仍可能暫時保留位置。", "ep": "尚未完成建立程序的連線狀態。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "協定編號", "en": "IP Protocol Number", "cat": "通訊安全", "ex": "像貨箱上標示裡面是哪一類物品。下一站知道要交給哪個處理窗口。", "ep": "IP 標頭中識別上層協定種類的數值。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "即時系統", "en": "Real-time System", "cat": "作業系統安全", "ex": "像救護派遣必須及時回應。晚到的正確答案也可能沒有用。", "ep": "需在指定時限內完成回應的系統。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "可插拔認證模組", "en": "PAM, Pluggable Authentication Modules", "cat": "作業系統安全", "ex": "像櫃檯可依規則換用證件、暗號等查驗流程。服務本身不必全部重建。", "ep": "讓系統依模組配置不同認證方式的架構。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "可量測服務", "en": "Measured Service", "cat": "雲端安全概論", "ex": "像水表記錄用了多少水。住戶與供應方都能依用量核對。", "ep": "監測資源用量，供管理與計量使用。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "啟發式偵測", "en": "Heuristic Detection / Heuristic Method", "cat": "惡意程式防護與弱點管理", "ex": "像警衛從躲鏡頭與反覆試門等行為判斷可疑。不是只對照通緝照片。", "ep": "依可疑特性與規則推測未知威脅的偵測方法。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "單元測試", "en": "Unit Testing", "cat": "程式與開發安全", "ex": "像先試單一水龍頭能不能正常開關。還不測整棟供水系統。", "ep": "單獨驗證一小段程式功能是否正確。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "單步執行", "en": "Single Stepping", "cat": "程式與開發安全", "ex": "像按一下才讓輸送帶前進一格。每格都可以慢慢查看。", "ep": "每次只執行一個步驟，方便觀察程式狀態。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "回歸測試", "en": "Regression Testing", "cat": "程式與開發安全", "ex": "像換了水龍頭後再試冷熱水與排水。確定修一處沒有壞另一處。", "ep": "修改後確認原本正常的功能沒有被破壞。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "固態硬碟", "en": "SSD, Solid-state Drive", "cat": "作業系統安全", "ex": "像不用翻轉的電子抽屜。取資料快，清除方式也要配合其特性。", "ep": "以半導體儲存資料、不需旋轉碟片的儲存裝置。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "國家漏洞資料庫", "en": "NVD, National Vulnerability Database", "cat": "程式與開發安全", "ex": "像可查詢各項召回事件及風險說明的總資料庫。資料可用於安排處理優先順序。", "ep": "由 NIST 維護的漏洞與評估資訊資料庫。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "國際行動用戶識別碼", "en": "IMSI, International Mobile Subscriber Identity", "cat": "行動裝置安全概論", "ex": "像電信服務合約對應的會員編號。與手上那台設備的出廠編號不同。", "ep": "識別行動通信訂戶的編號。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "國際行動設備識別碼", "en": "IMEI, International Mobile Equipment Identity", "cat": "行動裝置安全概論", "ex": "像手機這件實體物品的出廠身分牌。它辨認設備，不是目前使用的人。", "ep": "識別行動通信設備的編號。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "執行禁用位元", "en": "NX Bit, No-execute Bit", "cat": "作業系統安全", "ex": "像在文件區貼上禁止發號施令的標籤。這裡只放資料，不能當指揮台。", "ep": "標示記憶體頁不可執行程式碼的硬體機制。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "堆疊追蹤", "en": "Stack Trace", "cat": "程式與開發安全", "ex": "像記下問題包裹曾經過哪些工作站。能幫助定位是哪個交接出錯。", "ep": "列出程式發生問題時經過的呼叫路徑。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "多協定標籤交換", "en": "MPLS, Multiprotocol Label Switching", "cat": "通訊安全", "ex": "像包裹先貼好轉運標籤。各站依標籤處理，不必每次重查完整地址。", "ep": "依標籤快速轉送資料的網路技術。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "多處理機系統", "en": "Multiprocessor System", "cat": "作業系統安全", "ex": "像廚房有多位廚師一起做菜。可以分工處理多份訂單。", "ep": "由多個處理器共同工作的系統。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "多點傳送", "en": "Multicast", "cat": "通訊安全", "ex": "像只向已訂閱的住戶發活動通知。不是挨家挨戶全部投遞。", "ep": "把同一份資料送給特定的一群接收者。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "字元跳脫", "en": "Escaping", "cat": "程式與開發安全", "ex": "像在劇本中註明某句只是台詞。舞台人員就不會把它當真實操作指令。", "ep": "讓特殊字元以普通文字方式被解讀。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "安全例外處理", "en": "SafeSEH, Safe Structured Exception Handling", "cat": "作業系統安全", "ex": "像出事時只允許名冊上的值班人員接手。陌生人不能趁混亂指揮。", "ep": "限制程式只能使用已核准的例外處理入口。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "安全內容自動化協定", "en": "SCAP, Security Content Automation Protocol", "cat": "惡意程式防護與弱點管理", "ex": "像各檢查單位使用同一格式的表格。機器就能直接讀取與比對結果。", "ep": "用標準格式自動交換安全設定與弱點資訊。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "安全抹除", "en": "Secure Erase / ATA Secure Erase", "cat": "資料安全及備份管理", "ex": "像把書上的內容徹底處理到無法再讀。只擦掉封面名稱並不算完成。", "ep": "使用適合媒體的方法清除資料，降低復原可能。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "密文", "en": "Ciphertext", "cat": "資料安全及備份管理", "ex": "像只有收信人懂的暗語信。旁人看到字，也不容易知道意思。", "ep": "資料經加密後形成的不易直接讀懂內容。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "密碼套件", "en": "Cipher Suite", "cat": "資料安全及備份管理", "ex": "像一次選好門鎖、證件檢查與封條的配套。不能只看其中一項是否夠強。", "ep": "安全連線使用的一組金鑰交換、加密與驗證演算法。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "實體銷毀", "en": "Physical Destruction", "cat": "資料安全及備份管理", "ex": "像把含機密的紙張碎到無法拼回。介質本身被破壞才完成目的。", "ep": "破壞媒體本體，使資料難以再讀取。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "封包注入", "en": "Packet Injection", "cat": "網路安全", "ex": "像在雙方往返信件中夾入假信。收件人可能誤把它當成正常回覆。", "ep": "向通訊中插入偽造封包以干擾或操控。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "工控系統安全風險評估", "en": "IEC 62443-3-2, Security Risk Assessment for System Design", "cat": "物聯網安全概論", "ex": "像工廠規劃產線前評估哪些區域最危險。依風險安排分區與保護。", "ep": "指導工業自動化與控制系統設計風險評估的標準。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "廣播風暴", "en": "Broadcast Storm", "cat": "網路安全", "ex": "像社區擴音器不斷重複通知。大家一直被聲音淹沒，無法正常對話。", "ep": "大量廣播訊息塞滿網路，妨礙正常通訊。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "彩虹表攻擊", "en": "Rainbow Table Attack", "cat": "惡意程式防護與弱點管理", "ex": "像先做好大量暗號與結果的速查表。遇到相同結果就不用從頭計算。", "ep": "利用預先計算的對照結構猜回密碼。", "o": "考古題", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "待處理連線佇列", "en": "Backlog Queue", "cat": "通訊安全", "ex": "像候位名冊記下正在等待的客人。名冊滿了就難再接受新的候位。", "ep": "存放等待處理或完成的連線請求。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "循環冗餘校驗", "en": "CRC, Cyclic Redundancy Check", "cat": "通訊安全", "ex": "像貨單加一個可核對的合計數。能發現誤抄，但不能防止有心人一起改單。", "ep": "偵測資料傳輸或儲存意外錯誤的檢查碼。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "惡意基地台", "en": "Rogue AP", "cat": "通訊安全", "ex": "像有人私自在社區開一個側門。住戶可能在不知情下繞過正式入口。", "ep": "未經核准設置、可能危及安全的無線基地台。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "慢速 POST 攻擊", "en": "Slow HTTP POST Attack", "cat": "網路安全", "ex": "像客人結帳時一分鐘才拿出一枚硬幣。整條隊伍因此被卡住。", "ep": "極慢地傳送請求內容，長時間佔用連線。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "憑證填充", "en": "Credential Stuffing", "cat": "網路安全", "ex": "像撿到某間倉庫的鑰匙後再試別間。若屋主到處用同一把鎖，就可能全被打開。", "ep": "用外洩的帳號密碼組合登入其他服務。", "o": "兩者", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "憑證驗證", "en": "Certificate Verification", "cat": "程式與開發安全", "ex": "像核對證件的發證單位、期限和本人。只看到一張卡片還不夠。", "ep": "檢查憑證是否可信、有效且對應正確對象。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "戰術、技術與程序", "en": "TTPs, Tactics, Techniques and Procedures", "cat": "惡意程式防護與弱點管理", "ex": "像分析小偷想偷什麼、怎麼開門、如何逃走。比只記住一件外套更能辨認手法。", "ep": "描述攻擊目標、方法與實際操作模式。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "批次命令檔", "en": "BAT, Batch File", "cat": "作業系統安全", "ex": "像把一串家務步驟寫成清單。交給執行者後會依序處理。", "ep": "將多個命令依序執行的文字檔。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "抽象介面", "en": "Abstraction Interface", "cat": "作業系統安全", "ex": "像按電梯樓層鍵就能搭乘。乘客不用懂鋼索與馬達怎麼運轉。", "ep": "隱藏底層細節，提供較簡單的操作方式。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "持續整合與交付", "en": "CI/CD, Continuous Integration and Continuous Delivery/Deployment", "cat": "程式與開發安全", "ex": "像工廠每批零件到齊就自動組裝檢驗。通過規則後再安排出貨。", "ep": "自動整合變更、檢查並準備或執行軟體交付。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "指令碼病毒", "en": "Script Virus", "cat": "惡意程式防護與弱點管理", "ex": "像把破壞指示寫成短小工作便條。交給會照便條行事的人就能發作。", "ep": "以指令碼形式執行與散播的病毒。", "o": "兩者", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "挑戰握手認證協定", "en": "CHAP, Challenge-Handshake Authentication Protocol", "cat": "通訊安全", "ex": "像門衛出一道只有知道暗號的人才能回答的題。來客不必把暗號直接喊出。", "ep": "用挑戰與回應確認身分，避免直接傳送密碼。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "攻擊指標", "en": "IOA, Indicators of Attack", "cat": "惡意程式防護與弱點管理", "ex": "像有人反覆試門把又遮住鏡頭。觀察到的是可疑動作模式。", "ep": "顯示攻擊意圖或正在進行攻擊的行為線索。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "整合式威脅管理", "en": "UTM, Unified Threat Management", "cat": "網路安全", "ex": "像一個服務台兼辦驗票、安檢和失物處理。用同一處管理多種工作。", "ep": "把防火牆、防毒等多項防護集中在一起。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "文件物件模型", "en": "DOM, Document Object Model", "cat": "程式與開發安全", "ex": "像把一頁報紙拆成有層次的標題與段落區塊。每一塊都可個別找到與修改。", "ep": "把網頁內容表示成可由程式操作的物件樹。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "晶片卡驗證", "en": "Smart Card Authentication", "cat": "程式與開發安全", "ex": "像持有特殊防偽證件才能進場。不是影印一張外觀相同的紙就能通過。", "ep": "利用晶片卡內的安全資料確認身分。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "暗網", "en": "Dark Web", "cat": "通訊安全", "ex": "像必須知道特殊入口才能進入的地下會場。一般街道指示牌不會帶你到那裡。", "ep": "需特定工具或設定才能進入的隱藏網路服務。", "o": "考古題", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "暫時金鑰完整性協定", "en": "TKIP, Temporal Key Integrity Protocol", "cat": "通訊安全", "ex": "像在舊門鎖上增加輪換暗號的改良設計。仍不等於使用全新的安全鎖具。", "ep": "WPA 使用的舊式無線保護機制，已有安全限制。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "最後登入紀錄", "en": "lastlog", "cat": "日誌管理", "ex": "像名冊只保留每人最後一次到訪時間。要看全部歷史得查其他記錄。", "ep": "記錄各使用者最近一次登入資訊。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "本機安全授權子系統", "en": "LSASS, Local Security Authority Subsystem Service", "cat": "作業系統安全", "ex": "像大樓核對證件與執行門禁規定的值班室。裡面的認證資料尤其要保護。", "ep": "Windows 處理身分驗證與安全政策的系統程序。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "核心模式", "en": "Kernel Mode", "cat": "作業系統安全", "ex": "像具機房總鑰匙的值班主管。能直接操作重要設備。", "ep": "能執行高權限系統操作的處理器模式。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "檔案上傳漏洞", "en": "Unrestricted File Upload", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像倉庫不檢查貨物種類就收件。危險物品也能混進普通包裹裡。", "ep": "未限制上傳檔案，讓惡意內容進入或執行。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "次要登入服務", "en": "Windows Secondary Logon", "cat": "作業系統安全", "ex": "像同一人依核准暫時換一張工作證辦事。不同身分對應不同可做的事。", "ep": "讓 Windows 程式以另一使用者身分執行的服務。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "比特幣", "en": "Bitcoin", "cat": "物聯網安全概論", "ex": "像沒有單一帳房、由多方共同記帳的交換憑據。交易紀錄可被追查，不等於完全匿名。", "ep": "以區塊鏈維護交易記錄的數位資產。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "永恆之藍", "en": "EternalBlue", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像專門利用某款門鎖瑕疵的開鎖工具。裝了修正零件才可堵上這條路。", "ep": "利用 Windows SMB 漏洞的攻擊工具與手法。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "消磁", "en": "Degaussing", "cat": "資料安全及備份管理", "ex": "像把磁性記號全部打亂。它適用的材料有限，不是所有儲存物都有效。", "ep": "用強磁場破壞磁性媒體上的記錄。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "消費性物聯網安全標準", "en": "ETSI EN 303 645, Consumer IoT Cybersecurity", "cat": "物聯網安全概論", "ex": "像家電安全的最低檢查清單。出廠密碼與更新機制都要考慮。", "ep": "規範消費性物聯網基本安全要求的標準。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "混合型防火牆", "en": "Hybrid Firewall", "cat": "網路安全", "ex": "像門口同時查證件、行李和訪客紀錄。不同檢查各補上別人的不足。", "ep": "結合多種檢查方式的防火牆。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "混雜模式", "en": "Promiscuous Mode", "cat": "惡意程式防護與弱點管理", "ex": "像櫃檯把經過的信件都先記下。不限於只收寫給自己的那封。", "ep": "讓網卡接收可見的更多訊框供分析。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "營運持續管理標準", "en": "ISO 22301, Business Continuity Management Systems", "cat": "日誌管理", "ex": "像要求店家建立停業風險與復業管理制度。不是只準備一台備用機。", "ep": "規範營運持續管理系統要求的標準。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "物聯網十大風險", "en": "OWASP IoT Top 10", "cat": "物聯網安全概論", "ex": "像智慧家電的十大常見安全檢查表。提醒購買與設定時容易漏掉的項目。", "ep": "整理物聯網常見安全問題的清單。", "o": "兩者", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "物聯網安全與隱私指引", "en": "ISO/IEC 27400, IoT Security and Privacy", "cat": "物聯網安全概論", "ex": "像智慧家電從製作到使用的保護手冊。考慮功能之外，也顧及住戶資料。", "ep": "提供物聯網安全與隱私保護指引的標準。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "物聯網設備資安指引", "en": "NIST SP 800-213, IoT Device Cybersecurity Guidance", "cat": "物聯網安全概論", "ex": "像政府採購智慧設備前的需求清單。先確定設備要具備哪些保護能力。", "ep": "協助美國聯邦機關界定物聯網設備資安要求的指引。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "監控與資料擷取系統", "en": "SCADA, Supervisory Control and Data Acquisition", "cat": "物聯網安全概論", "ex": "像總調度室同時看各站水位並安排開關水閘。遠方狀態與動作都能集中管理。", "ep": "集中監看工業現場並蒐集資料、發送控制的系統。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "真實性", "en": "Authenticity", "cat": "網路安全", "ex": "像核對餐廳展示的合格證明。確認它真的由主管機關發出。", "ep": "確認對象或資料確實來自所宣稱的來源。", "o": "兩者", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "知識即服務", "en": "KaaS, Knowledge as a Service", "cat": "雲端安全概論", "ex": "像訂閱專家整理的解題服務。它描述提供的內容，不是標準的三種廚房租法。", "ep": "以服務方式提供知識，非 NIST 三大基本雲端模式。", "o": "兩者", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "磁碟區陰影複製", "en": "VSS, Volume Shadow Copy Service", "cat": "資料安全及備份管理", "ex": "像在大家仍寫帳時安排一次一致的抄錄時點。避免前後頁面屬於不同時間。", "ep": "Windows 為使用中的資料建立一致快照的服務。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "私用交換機", "en": "PBX, Private Branch Exchange", "cat": "通訊安全", "ex": "像公司總機。外人打總號後再由它轉到對應分機。", "ep": "供組織內部分機與外線通話交換的系統。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "程式碼簽署", "en": "Code Signing", "cat": "程式與開發安全", "ex": "像廠商在零件包裝加可驗證封印。收到時可查來源與是否遭拆換。", "ep": "以數位簽章證明程式來源並檢查是否被改動。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "程式碼重構", "en": "Code Refactoring", "cat": "程式與開發安全", "ex": "像整理廚房動線卻維持菜單不變。客人吃到的餐點相同，廚師工作更順。", "ep": "保留外在行為，重新整理程式內部結構。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "簡單檔案傳輸協定", "en": "TFTP, Trivial File Transfer Protocol", "cat": "通訊安全", "ex": "像無需身分查驗的簡易取件窗口。方便，但不適合直接交付機密物品。", "ep": "簡化的 UDP 檔案傳輸協定，本身缺少驗證與加密。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "簡訊驗證", "en": "SMS Authentication", "cat": "程式與開發安全", "ex": "像把臨時暗號送到事先登記的收件處。能拿到訊息的人才可回覆暗號。", "ep": "以寄到手機的訊息作為身分確認的一環。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "網路型入侵偵測系統", "en": "NIDS, Network-based Intrusion Detection System", "cat": "網路安全", "ex": "像路口監視器觀察來往車流。它看的是路上的動靜。", "ep": "從網路流量中找出可疑攻擊。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "網路資訊服務", "en": "NIS, Network Information Service", "cat": "作業系統安全", "ex": "像多棟宿舍共用一份住戶名冊。變更住戶資料後供各棟查詢。", "ep": "在 Unix 類系統間分享帳號等管理資料的服務。", "o": "兩者", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "網際封包交換協定", "en": "IPX, Internetwork Packet Exchange", "cat": "通訊安全", "ex": "像某套舊物流體系使用的地址與運送規則。與現今常見規則不同。", "ep": "早期 Novell 網路使用的網路層協定。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "網際網路安全關聯與金鑰管理協定", "en": "ISAKMP, Internet Security Association and Key Management Protocol", "cat": "通訊安全", "ex": "像先訂好雙方交接貴重物品的契約格式。具體怎麼交換鑰匙由搭配機制完成。", "ep": "建立與管理安全關聯的協定框架。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "網際網路服務供應商", "en": "ISP, Internet Service Provider", "cat": "通訊安全", "ex": "像提供通往公路入口的業者。你透過它接上更大的交通網。", "ep": "提供網際網路接取等服務的業者。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "網際網路群組管理協定", "en": "IGMP, Internet Group Management Protocol", "cat": "通訊安全", "ex": "像登記誰要收到社區特定活動的通知。送訊息時依訂閱名單辦理。", "ep": "管理 IPv4 多點傳送群組成員的協定。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "網頁後門", "en": "Web Shell / Webshell", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像在店內藏一個能下命令的小窗口。外人不用走正式櫃檯也能指揮店裡。", "ep": "透過網站介面執行命令或管理檔案的後門。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "群組識別碼", "en": "GID, Group Identifier", "cat": "作業系統安全", "ex": "像不同部門各有一個代碼。可依部門決定共同使用的設施。", "ep": "系統用來識別使用者群組的編號。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "聯合查詢型 SQL 注入", "en": "Union-based SQL Injection", "cat": "程式與開發安全", "ex": "像在原本領一張單據的要求中夾入別份單據。窗口把兩份一起交出去。", "ep": "利用合併查詢結果把其他資料帶到回覆中。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "虛擬桌面基礎架構", "en": "VDI, Virtual Desktop Infrastructure", "cat": "行動裝置安全概論", "ex": "像把工作桌放在受管制的辦公室。人在外地仍能使用，文件主要留在辦公室。", "ep": "集中執行桌面環境，讓使用者遠端操作。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "行動程式碼", "en": "Mobile Code", "cat": "程式與開發安全", "ex": "像收到一張外地寄來的工作指示單。拿到後由你這邊的人照著執行。", "ep": "從遠端取得後在本地環境執行的程式碼。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "行程隔離", "en": "Process Isolation", "cat": "作業系統安全", "ex": "像考場每人有自己的桌子與隔板。不能隨手翻旁人的試卷。", "ep": "限制程式互相干擾或任意讀取彼此記憶體。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "複合型病毒", "en": "Multipartite Virus", "cat": "惡意程式防護與弱點管理", "ex": "像害蟲不只躲衣櫃，也藏在床墊。只清一處仍可能再次擴散。", "ep": "同時感染多種位置或載體的病毒。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "認證標頭", "en": "AH, Authentication Header", "cat": "通訊安全", "ex": "像包裹加上可核對的封條。能查是否被動過，但不把內容鎖起來。", "ep": "IPsec 提供來源驗證與完整性保護的協定。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "資料保管人", "en": "Data Custodian", "cat": "資料安全及備份管理", "ex": "像檔案室保管員。照規定保存文件並處理借還。", "ep": "依政策實際保管、備份與保護資料的人員。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "資料剖析", "en": "Data Profiling", "cat": "日誌管理", "ex": "像整理問卷前先看哪些題目常漏填。了解資料狀況才能安排處理。", "ep": "檢查資料的分布、格式與品質特性。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "資料執行防止", "en": "DEP, Data Execution Prevention", "cat": "作業系統安全", "ex": "像規定收件箱只收文件，不能拿來發號施令。紙條寫命令也不會自動照做。", "ep": "阻止把只該放資料的記憶體拿來執行指令。", "o": "考古題", "s": ["109-1"], "w": 1, "r": 0, "h": []}, {"zh": "資料治理", "en": "Data Governance", "cat": "資料安全及備份管理", "ex": "像圖書館規定誰編目、誰借閱、誰保管。讓資料從入庫到使用都有規矩。", "ep": "訂定資料責任、品質、使用與保護規則。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "資料清理", "en": "Data Cleaning", "cat": "日誌管理", "ex": "像整理問卷前先處理空白與明顯填錯的欄位。乾淨資料才方便後續統計。", "ep": "修正或移除不完整、錯誤或不適用的資料。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "資料聚合", "en": "Database Aggregation", "cat": "資料安全及備份管理", "ex": "像把每天單張收據合計成每月支出。合在一起可能看出原先不明顯的隱私。", "ep": "把多筆資料合併整理成整體資訊。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "資料蒐集", "en": "Data Collection", "cat": "日誌管理", "ex": "像先把各分店的收據收齊。還沒開始整理或判讀內容。", "ep": "取得並匯集分析所需的資料。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "資料複寫", "en": "Replication", "cat": "資料安全及備份管理", "ex": "像兩本帳簿持續互相同步。錯字也可能一起抄過去，所以仍要備份。", "ep": "讓資料變動同步或陸續複製到其他位置。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "資源監視器", "en": "Resource Monitor", "cat": "作業系統安全", "ex": "像逐項查看每個工作占了多少桌面與人手。容易找出誰把空間占滿。", "ep": "查看程式對處理器、記憶體與磁碟等使用情況。", "o": "考古題", "s": ["樣題2"], "w": 1, "r": 0, "h": []}, {"zh": "資訊安全管理標準家族", "en": "ISO/IEC 27000 Series", "cat": "日誌管理", "ex": "像一套分冊的安全管理百科。各冊有不同主題與用途。", "ep": "涵蓋資訊安全管理系統與相關指引的一系列標準。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "路由資訊協定", "en": "RIP, Routing Information Protocol", "cat": "通訊安全", "ex": "像司機彼此告知到目的地需經幾站。再依站數選擇路線。", "ep": "以跳數等資訊選擇路徑的距離向量路由協定。", "o": "考古題", "s": ["樣題1"], "w": 1, "r": 0, "h": []}, {"zh": "路由迴圈攻擊", "en": "Routing Loop Attack", "cat": "物聯網安全概論", "ex": "像把兩站的指示牌互相指回對方。包裹就在兩站之間一直往返。", "ep": "操控路由，使封包在錯誤循環路徑中打轉。", "o": "兩者", "s": ["110-1"], "w": 1, "r": 0, "h": []}, {"zh": "透明模式", "en": "Transparent Mode", "cat": "網路安全", "ex": "像在原走廊中放一個檢查站。房間門牌與走路路線大致不必改。", "ep": "讓防護設備以橋接方式介入，不改動原有位址架構。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "逗號分隔資料", "en": "CSV, Comma-separated Values", "cat": "程式與開發安全", "ex": "像把表格每列寫成一行並以逗號分欄。簡單格式也可能裝有敏感資料。", "ep": "用分隔字元排列欄位的純文字資料格式。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "通用唯一識別碼", "en": "UUID, Universally Unique Identifier", "cat": "行動裝置安全概論", "ex": "像替每件物品編一個非常長的號碼。不同地方各自編號也較不易重複。", "ep": "用來大幅降低識別碰撞機會的長識別碼。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "進階持續性威脅", "en": "APT, Advanced Persistent Threat", "cat": "惡意程式防護與弱點管理", "ex": "像有人長期混入商家打工偷看機密。不是只來一次的隨機鬧事。", "ep": "有計畫、長期潛伏並持續達成目標的攻擊。", "o": "兩者", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "遠端日誌抄寫", "en": "Remote Journaling", "cat": "資料安全及備份管理", "ex": "像每做一筆生意就把記帳內容送去分店。總店出事時可依記錄補回。", "ep": "將交易或變更記錄持續傳到遠端以供復原。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "遠端清除", "en": "Remote Wipe", "cat": "行動裝置安全概論", "ex": "像遺失的電子保管盒能遠端清空。仍須先有能收到指令的條件。", "ep": "從遠端刪除遺失或受控裝置上的資料。", "o": "兩者", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "遠端電子備份", "en": "Electronic Vaulting", "cat": "資料安全及備份管理", "ex": "像每晚將當日帳簿影本整批送到另一間保管室。不是每寫一筆就立刻送。", "ep": "批次把備份資料傳到遠端保存場所。", "o": "考古題", "s": ["111-1"], "w": 1, "r": 0, "h": []}, {"zh": "邊界檢查", "en": "Bounds Checking", "cat": "程式與開發安全", "ex": "像搬貨前確認箱子裝得下。超過容量就拒收，而不是硬塞。", "ep": "確認資料長度或位置沒有超出允許範圍。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "郵局協定第三版", "en": "POP3, Post Office Protocol version 3", "cat": "通訊安全", "ex": "像到郵局把信領回家。它主要處理取信這件事。", "ep": "讓使用者從郵件伺服器取回郵件。", "o": "考古題", "s": ["111-2"], "w": 1, "r": 0, "h": []}, {"zh": "醫療保險可攜性與責任法", "en": "HIPAA, Health Insurance Portability and Accountability Act", "cat": "日誌管理", "ex": "像對醫療資料保管設定特別規則。接觸病歷的人需依規定保護內容。", "ep": "包含美國受規範醫療資訊隱私與安全要求的法律。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "錯誤型 SQL 注入", "en": "Error-based SQL Injection", "cat": "程式與開發安全", "ex": "像故意填錯申請讓櫃檯說出內部處理細節。錯誤回覆成了偷看資訊的線索。", "ep": "利用資料庫錯誤訊息取得資訊的注入方式。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "鏡像備援場所", "en": "Mirrored Site", "cat": "資料安全及備份管理", "ex": "像兩家店同步保有訂單與作業能力。一家中斷，另一家能快速接續。", "ep": "與主要場所同步運作或資料，迅速接手服務。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "長期演進通訊", "en": "LTE, Long Term Evolution", "cat": "物聯網安全概論", "ex": "像某一代改良的移動聯絡道路。不同世代可採不同保護規則。", "ep": "常用於第四代行動網路的通訊技術。", "o": "考古題", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "開放式重新導向", "en": "Open Redirect", "cat": "作業系統與應用程式（含資料庫與網頁）攻擊手法", "ex": "像服務台照任何人寫的地址幫旅客叫車。旅客信任服務台，卻被送到騙子據點。", "ep": "網站接受未受限制的轉址目標，將人導向惡意位置。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "隨需自助服務", "en": "On-demand Self-service", "cat": "雲端安全概論", "ex": "像在自助機台直接租借置物櫃。不必每次等店員人工安排。", "ep": "使用者可自行申請所需雲端資源。", "o": "兩者", "s": ["112-1"], "w": 1, "r": 0, "h": []}, {"zh": "隱匿型病毒", "en": "Stealth Virus", "cat": "惡意程式防護與弱點管理", "ex": "像小偷在你查看倉庫時展示一份假的正常清單。東西已少了，報表卻看不出來。", "ep": "攔截系統查詢以隱藏感染痕跡的病毒。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "雙黑箱測試", "en": "Double-blind Testing", "cat": "程式與開發安全", "ex": "像沒有先通知店員的神秘客訪查。可看出店家平常的真實反應。", "ep": "測試者資訊有限，防守方也不預知測試細節。", "o": "考古題", "s": ["112-2"], "w": 1, "r": 0, "h": []}, {"zh": "雲端跳躍", "en": "Cloud Hopper", "cat": "雲端安全概論", "ex": "像先取得物業公司的總鑰匙。再藉它進入不同客戶的大樓。", "ep": "先入侵服務商，再透過信任關係攻擊其客戶。", "o": "兩者", "s": ["110-2"], "w": 1, "r": 0, "h": []}, {"zh": "非自主式存取控制", "en": "Non-DAC, Non-discretionary Access Control", "cat": "作業系統安全", "ex": "像公司規定只有值班人員可進倉庫。倉庫使用者不能自行加人。", "ep": "由組織規則而非個別擁有者決定權限。", "o": "考古題", "s": ["108-1"], "w": 1, "r": 0, "h": []}, {"zh": "預存程序", "en": "Stored Procedure", "cat": "程式與開發安全", "ex": "像檔案員保存一套固定辦事流程。需要時直接按名稱叫用。", "ep": "事先存放在資料庫中的可執行操作程序。", "o": "考古題", "s": ["109-2"], "w": 1, "r": 0, "h": []}, {"zh": "Amazon Cloud Directory", "en": "Amazon Cloud Directory", "cat": "作業系統安全", "ex": "像在遠端租用一套組織名冊系統。可用不同階層整理人員與物品。", "ep": "用於雲端階層式目錄資料管理的 ous Insider", "cat": "雲端安全概論", "ex": "像保管員利用工作鑰匙偷走貨物。有權進門不代表每次行為都正當。", "ep": "濫用合法內部身分從事有害活動的人。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "應用程式安全標準", "en": "ISO/IEC 27034, Application Security", "cat": "程式與開發安全", "ex": "像為各種建築工程建立安全管理方法。不同建案可依需求套用。", "ep": "指導如何在應用程式生命週期管理安全的標準。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "持久性 Cookie", "en": "Persistent Cookie", "cat": "程式與開發安全", "ex": "像會員卡放進皮夾帶回家。下次到店仍能出示使用。", "ep": "關閉瀏覽器後仍保留到期限的 Cookie。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "校驗和", "en": "Checksum", "cat": "惡意程式防護與弱點管理", "ex": "像收貨時核對總件數與重量。對不上就知道可能有遺失或改變。", "ep": "由資料算出的檢查值，用來發現變化或錯誤。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "災難復原計畫", "en": "DRP, Disaster Recovery Plan", "cat": "資料安全及備份管理", "ex": "像火災後依計畫重建店面設備與帳本。讓關鍵作業逐步恢復。", "ep": "規劃重大事故後如何恢復資訊系統與資料。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "物聯網參考架構", "en": "ISO/IEC 30141, IoT Reference Architecture", "cat": "物聯網安全概論", "ex": "像提供智慧社區的共同設計藍圖。讓不同廠商用相近語言討論結構。", "ep": "描述物聯網系統共通架構與概念的標準。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "盡職調查", "en": "Due Diligence", "cat": "雲端安全概論", "ex": "像租倉庫前查看消防設備與契約。不能只聽業務說安全就簽約。", "ep": "採用服務前，充分查核責任、能力與風險。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "硬編碼密碼", "en": "Hard-coded Password", "cat": "物聯網安全概論", "ex": "像把門禁暗號永久刻在門鎖裡。要更換時非常困難。", "ep": "直接固定寫在程式或設備中的密碼。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "穩健性", "en": "Robustness", "cat": "物聯網安全概論", "ex": "像推車走過顛簸地面仍保持穩定。小變動不會讓整車翻倒。", "ep": "面對異常輸入或環境變化仍能合理運作的能力。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "第二層轉送協定", "en": "L2F, Layer 2 Forwarding", "cat": "通訊安全", "ex": "像把地方接駁車整台放上運輸車。原本的乘客安排可以保留。", "ep": "在網路上轉送第二層連線的通道協定。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "第二層通道協定", "en": "L2TP, Layer 2 Tunneling Protocol", "cat": "通訊安全", "ex": "像在公共道路上劃出專用運貨流程。貨物仍要另外上鎖才有保密性。", "ep": "建立第二層通道，本身不提供資料加密。", "o": "學習指引", "s": [], "w": 0, "r": 0, "h": []}, {"zh": "系統映像檔", "en": "System Image", "c
